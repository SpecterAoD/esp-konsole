; ESP-Konsole: serielle Konsole des piholepi per Telnet (Wemos D1 mini, ESP8266)
; Bauen:  pio run   (Laptop, /srv/claude/Projekte/esp-konsole)  -> .pio/build/d1_mini/firmware.bin
; Signieren und Einspielen: siehe README.md
[platformio]
default_envs = d1_mini

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 80000000L
build_flags =
  -Wall
  !python3 werkzeuge/version.py

; Wie oben, schreibt aber die Werte aus include/secrets.h auch dann ins EEPROM, wenn dort schon gültige stehen
; (zum Ändern von Passwörtern):  pio run -e d1_mini_konfig
[env:d1_mini_konfig]
extends = env:d1_mini
build_flags =
  ${env:d1_mini.build_flags}
  -DKONFIG_ERZWINGEN
