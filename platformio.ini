; ESP-Konsole: serielle Konsole des piholepi per Telnet (Wemos D1 mini, ESP8266)
; Bauen:  pio run           (auf dem Laptop, im Ordner piholepi/esp-konsole)
; Ergebnis: .pio/build/d1_mini/firmware.bin  -> flashen siehe README.md
[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 80000000L
build_flags = -Wall
